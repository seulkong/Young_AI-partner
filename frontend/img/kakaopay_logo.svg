<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100">
  <!-- Kakao Pay: yellow pill -->
  <rect width="260" height="100" rx="50" fill="#FFDE00"/>

  <!-- Black speech bubble / chat icon (KakaoTalk bubble) -->
  <!-- Main bubble body -->
  <ellipse cx="68" cy="46" rx="30" ry="26" fill="#111111"/>
  <!-- Tail of bubble - points down-left -->
  <path d="M 50 68 Q 44 80 38 75 Q 48 72 55 68 Z" fill="#111111"/>

  <!-- "pay" in dark/black bold text -->
  <text x="163" y="67" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" fill="#111111" text-anchor="middle">pay</text>
</svg>
