<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100">
  <!-- Naver Pay: bright green pill shape -->
  <rect width="260" height="100" rx="50" fill="#03C75A"/>

  <!-- Black circle with green "N" -->
  <circle cx="68" cy="50" r="32" fill="#111111"/>
  <!-- "N" inside the black circle in green -->
  <text x="68" y="63" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="36" fill="#03C75A" text-anchor="middle">N</text>

  <!-- "pay" dark text to the right -->
  <text x="163" y="67" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" fill="#111111" text-anchor="middle">pay</text>
</svg>
